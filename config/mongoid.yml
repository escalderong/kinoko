development:
  clients:
    default:
      # Defaults to a local MongoDB (no network round trips) for day-to-day
      # dev work. To swap back to Atlas (or any other host), set MONGO_DEV_URI
      # in .env to the same connection string that used to live in
      # MONGO_ATLAS_DEV_URI — that old var is no longer read here, so just
      # setting it again won't bring Atlas back on its own.
      uri: <%= ENV.fetch("MONGO_DEV_URI", "mongodb://localhost:27017/kinoko_development") %>
      options:
        server_selection_timeout: 5

test:
  clients:
    default:
      uri: <%= ENV["MONGO_ATLAS_TEST_URI"] %>
      options:
        read:
          mode: :primary
        max_pool_size: 1

production:
  clients:
    default:
      uri: <%= ENV["MONGO_ATLAS_PROD_URI"] %>
      options:
        connect_timeout: 15